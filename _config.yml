title: Roman Jay
author: Roman Jay David
description: >-
  Computer Science student specializing in Linux, networking, and IT infrastructure. Explore my projects,
  certifications, and technical experience.
url: "https://romanjay.tech"
lang: en

markdown: kramdown
strict_front_matter: true
liquid:
  error_mode: strict
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - vendor

collections:
  writeups:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: writeups
    values:
      layout: writeup
      featured: false
      order: 100
